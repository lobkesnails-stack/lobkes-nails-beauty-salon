<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Diploma's | Lobke's Nails & Beauty Salon</title>

  <link rel="stylesheet" href="../style.css">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  >
</head>

<body class="diploma-page">

  <main class="diploma-section">

    <a href="../index.html" class="back-button">
      <i class="bi bi-arrow-left"></i>
      Terug naar de homepage
    </a>

    <div class="diploma-heading">
      <p class="diploma-label">Opleidingen en certificaten</p>
      <h1>Mijn diploma's</h1>
      <p>
        Bekijk hier de diploma's en certificaten die ik met trots heb behaald.
      </p>
    </div>

    <div class="diploma-grid">

      <article class="diploma-card">
      <img
      src="IMG_BIAB.jpg"
      alt="BIAB-diploma van Lobke"
      >

        <div class="diploma-card-text">
          <h2>BIAB-certificaat</h2>
          <p>Certificaat voor Professionele BIAB-nagelverzorging.</p>
        </div>
      </article>

      <article class="diploma-card">
        <img
  src="IMG_diplomaBIAB.jpg"
  alt="BIAB-certificaat van Lobke"
>

        <div class="diploma-card-text">
          <h2>BIAB tenen-certificaat </h2>
          <p>Certificaat voor professionele BIAB-teennagelverzorging.</p>
        </div>
      </article>

    </div>

  </main>

</body>
</html>
